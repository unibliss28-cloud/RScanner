name: Parent Lead Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fix - create data folder
        run: mkdir -p data && echo "[]" > data/leads.json

      - name: Install deps
        run: pip install praw requests

      - name: Scan only - no Ollama
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "RScanner by unibliss28-cloud"
        run: |
          python -c "
          import praw, os, json
          reddit = praw.Reddit(client_id=os.getenv('REDDIT_CLIENT_ID'), client_secret=os.getenv('REDDIT_CLIENT_SECRET'), user_agent=os.getenv('REDDIT_USER_AGENT'))
          posts=[]
          for p in reddit.subreddit('Parenting+SingleParents').new(limit=15):
            if 'allowance' in p.title.lower():
              posts.append({'title': p.title, 'url': 'https://reddit.com'+p.permalink})
          print(posts)
          json.dump(posts, open('data/leads.json','w'), indent=2)
          "
