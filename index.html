<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RScanner Auto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-3">
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-4">
  <h1 class="font-black text-xl">RScanner Auto</h1>
  <p class="text- text-gray-500">Auto saves leads in phone - works on wifi / Jio</p>

  <label class="text-xs font-bold mt-3 block">Groq Key gsk_...</label>
  <input id="groqKey" class="w-full border rounded p-2 text-sm" placeholder="gsk_...">

  <div class="flex gap-2 mt-3">
    <button onclick="scan()" id="scanBtn" class="bg-black text-white flex-1 p-3 rounded-xl font-bold">SCAN NOW</button>
    <button onclick="toggleAuto()" id="autoBtn" class="bg-gray-200 flex-1 p-3 rounded-xl font-bold text-sm">AUTO: OFF</button>
  </div>

  <div class="flex justify-between mt-2">
    <span id="status" class="text- text-blue-600">Idle</span>
    <button onclick="clearLeads()" class="text- text-red-500">Clear</button>
  </div>
  <div id="out" class="mt-3 space-y-3"></div>
</div>

<script>
let autoInterval = null;
let seenIds = new Set(JSON.parse(localStorage.getItem('seenIds')||'[]'));
let leadsCache = JSON.parse(localStorage.getItem('leadsCache')||'[]');

groqKey.value = localStorage.getItem('groqKey')||'';
groqKey.oninput = ()=> localStorage.setItem('groqKey', groqKey.value);

window.onload = ()=> { render(leadsCache); if(leadsCache.length) status.innerText=`Loaded ${leadsCache.length} saved leads`; };

function render(list){
  const out=document.getElementById('out'); out.innerHTML='';
  list.slice().reverse().forEach(c=>{
    let d=document.createElement('div'); d.className='border rounded-lg p-3';
    d.innerHTML=`<div class="font-bold text-sm">${c.title}</div>
    <div class="text- text-gray-500">r/${c.sub} • ${c.kw} • ${c.time}</div>
    <div class="flex gap-2 mt-2"><a href="${c.url}" target="_blank" class="text-xs bg-gray-100 px-3 py-1 rounded-full">Open</a>
    <button onclick="draft(this,'${c.title.replace(/'/g,'')}')" class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full">AI Draft</button></div>
    <div class="draft text-xs mt-2 bg-yellow-50 p-2 rounded hidden"></div>`;
    out.appendChild(d);
  });
}

async function scan(){
  const keywords = ["pocket money","kids allowance","how much allowance","teach kids money","allowance age","chores for money"];
  const subs = ["Parenting","Mommit","daddit","SingleParents","personalfinance"];
  status.innerText='Auto scanning... keep app open';
  let newCount=0;
  for(let sub of subs){
    for(let k of keywords){
      try{
        let res = await fetch(`https://www.reddit.com/r/${sub}/search.json?q=${encodeURIComponent(k)}&restrict_sr=1&sort=new&limit=3&t=day`);
        if(!res.ok) continue;
        let data = await res.json();
        for(let ch of data.data.children){
          if(seenIds.has(ch.data.id)) continue;
          seenIds.add(ch.data.id);
          leadsCache.push({id:ch.data.id, title:ch.data.title, sub, kw:k, url:`https://reddit.com${ch.data.permalink}`, time:new Date().toLocaleTimeString()});
          newCount++;
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,1200));
    }
  }
  localStorage.setItem('seenIds', JSON.stringify([...seenIds]));
  localStorage.setItem('leadsCache', JSON.stringify(leadsCache.slice(-100)));
  render(leadsCache.slice(-100));
  status.innerText = `Found ${newCount} new, total ${leadsCache.length} saved. Last: ${new Date().toLocaleTimeString()}`;
}

function toggleAuto(){
  if(autoInterval){ clearInterval(autoInterval); autoInterval=null; autoBtn.innerText='AUTO: OFF'; autoBtn.className='bg-gray-200 flex-1 p-3 rounded-xl font-bold text-sm'; status.innerText='Auto stopped'; return; }
  autoBtn.innerText='AUTO: ON (5min)'; autoBtn.className='bg-green-600 text-white flex-1 p-3 rounded-xl font-bold text-sm';
  scan();
  autoInterval = setInterval(scan, 5*60*1000); // 5 min
  status.innerText='AUTO ON - will scan every 5 min while this tab is open';
}

function clearLeads(){ localStorage.removeItem('leadsCache'); localStorage.removeItem('seenIds'); leadsCache=[]; seenIds=new Set(); render([]); status.innerText='Cleared'; }

async function draft(btn,title){
  const key=groqKey.value.trim(); if(!key){alert('Paste gsk_');return;}
  const div=btn.parentElement.nextElementSibling; div.classList.remove('hidden'); div.innerText='Drafting...';
  try{
    let r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`}, body:JSON.stringify({model:'llama-3.1-8b-instant', messages:[{role:'user',content:`Parent: "${title}". 3 line helpful reply about kids money habits, no links.`}], temperature:0.7})});
    let j=await r.json(); div.innerText=j.choices[0].message.content;
  }catch(e){div.innerText='Error check key';}
}
</script>
</body>
</html>
