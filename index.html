<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RScanner v2 - Phone Only</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-3">
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-4">
  <h1 class="font-black text-xl">RScanner v2 - Phone</h1>
  <p class="text-xs text-gray-500">No laptop, no heavy model needed</p>

  <label class="text-xs font-bold mt-3 block">Groq API Key (free, stays in phone)</label>
  <input id="groqKey" class="w-full border rounded p-2 text-sm" placeholder="gsk_...">

  <label class="text-xs font-bold mt-3 block">Keywords</label>
  <input id="keywords" class="w-full border rounded p-2 text-sm" value="allowance, kids money, kids won't save">

  <label class="text-xs font-bold mt-3 block">Subreddits</label>
  <input id="subs" class="w-full border rounded p-2 text-sm" value="Parenting,SingleParents,personalfinance">

  <button onclick="scan()" id="scanBtn" class="bg-black text-white w-full p-3 rounded-xl mt-4 font-bold">SCAN NOW</button>
  <div id="status" class="text-xs text-center mt-2 text-blue-600"></div>
  <div id="out" class="mt-4 space-y-3"></div>
</div>

<script>
groqKey.value = localStorage.getItem('groqKey') || '';
groqKey.oninput = ()=> localStorage.setItem('groqKey', groqKey.value);

async function scan(){
  const kw = keywords.value.toLowerCase().split(',').map(s=>s.trim());
  const subList = subs.value.split(',').map(s=>s.trim());
  const out = document.getElementById('out');
  out.innerHTML = ''; status.innerText = 'Scanning...';
  for(let sub of subList){
    try{
      let res = await fetch(`https://www.reddit.com/r/${sub}/new.json?limit=20`);
      let data = await res.json();
      for(let c of data.data.children){
        if(kw.some(k=> c.data.title.toLowerCase().includes(k))){
          let d=document.createElement('div'); d.className='border rounded-lg p-3';
          d.innerHTML=`<div class="font-bold text-sm">${c.data.title}</div>
          <div class="text-xs text-gray-500">r/${sub}</div>
          <div class="flex gap-2 mt-2"><a href="https://reddit.com${c.data.permalink}" target="_blank" class="text-xs bg-gray-100 px-2 py-1 rounded">Open</a>
          <button onclick="draft(this,'${c.data.title.replace(/'/g,'')}')" class="text-xs bg-blue-600 text-white px-2 py-1 rounded">AI Draft (2min gap)</button></div>
          <div class="draft text-xs mt-2 bg-yellow-50 p-2 rounded hidden"></div>`;
          out.appendChild(d);
        }
      }
    }catch(e){}
  }
  status.innerText = `Found ${out.children.length} leads`;
}

async function draft(btn, title){
  const key = groqKey.value.trim(); if(!key){ alert('Paste Groq gsk_ key first'); return; }
  const div = btn.parentElement.nextElementSibling; div.classList.remove('hidden');
  let count=120; let t=setInterval(()=>{div.innerText=`2 min gap... ${count--}s`; if(count<0) clearInterval(t)},1000);
  await new Promise(r=>setTimeout(r,120000));
  div.innerText='Generating draft...';
  try{
    let r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body: JSON.stringify({model:'llama-3.1-8b-instant', messages:[{role:'user',content:`Parent asks: ${title}. Give 3 line helpful, empathetic reply about teaching kids money, no links, no selling.`}], temperature:0.7})
    });
    let j=await r.json(); div.innerText = j.choices[0].message.content;
  }catch(e){ div.innerText='Error: check Groq key / internet'; }
}
</script>
</body>
</html>
